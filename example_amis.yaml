esphome:
  name: amis
  # amis_meter reuses the obis_code validator introduced in ESPHome 2026.6.0
  min_version: 2026.6.0

esp32:
  board: esp-wrover-kit

wifi:
  ssid: "xxxxxxx"
  password: "xxxxxxxxxxxx"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "AMIS Fallback Hotspot"
    password: "xxxxxxxxxxxxxx"

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome

external_components:
  - source: github://lcnittl/esphome-amis
    components: [amis_meter]

# Required by total_daily_energy
time:
  - platform: homeassistant
    id: homeassistant_time

# The meter transmits with 9600 baud, 8 data bits, even parity, 1 stop bit
uart:
  id: uart_bus
  tx_pin: 32
  rx_pin: 16
  baud_rate: 9600
  parity: EVEN

amis_meter:
  id: amis_meter_bus
  uart_id: uart_bus
  # 32 character hex key, obtained from the Netz OÖ customer portal
  decryption_key: "1234567890ABCDEF1234567890ABCDEF"

sensor:
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.1.8.0.255"
    name: "Energy A+"
    unit_of_measurement: Wh
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.2.8.0.255"
    name: "Energy A-"
    unit_of_measurement: Wh
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.3.8.1.255"
    name: "Reactive Energy R+"
    unit_of_measurement: varh
    accuracy_decimals: 0
    state_class: total_increasing
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.4.8.1.255"
    name: "Reactive Energy R-"
    unit_of_measurement: varh
    accuracy_decimals: 0
    state_class: total_increasing
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.1.7.0.255"
    name: "Instantaneous Power P+"
    id: instantaneous_power_a
    unit_of_measurement: W
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.2.7.0.255"
    name: "Instantaneous Power P-"
    id: instantaneous_power_a_negative
    unit_of_measurement: W
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    # P- is published right after P+ from the same telegram, so computing the
    # balance here guarantees both operands belong to the same telegram
    on_value:
      - sensor.template.publish:
          id: instantaneous_power_balance
          state: !lambda return id(instantaneous_power_a).state - x;
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.3.7.0.255"
    name: "Reactive Instantaneous Power Q+"
    unit_of_measurement: var
    accuracy_decimals: 0
    state_class: measurement
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "1.0.4.7.0.255"
    name: "Reactive Instantaneous Power Q-"
    unit_of_measurement: var
    accuracy_decimals: 0
    state_class: measurement

  # Net active power (P+ - P-), updated once per telegram via the
  # on_value automation of the P- sensor above
  - platform: template
    name: "Instantaneous Power Balance"
    id: instantaneous_power_balance
    update_interval: never
    unit_of_measurement: W
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: total_daily_energy
    name: "AMIS Daily Energy"
    power_id: instantaneous_power_a
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh
    icon: mdi:clock-alert

text_sensor:
  - platform: amis_meter
    amis_meter_id: amis_meter_bus
    obis_code: "0.0.1.0.0.255"
    name: "AMIS Timestamp"
